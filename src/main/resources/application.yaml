
spring:
  application:
    name: casemanagement
  lifecycle:
    timeout-per-shutdown-phase: 45s

  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 30s

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/case_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    admin:
      auto-create: true

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:case-management-group}
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      properties:
        max.poll.interval.ms: 300000
        max.poll.records: 10

    listener:
      ack-mode: manual_immediate
      concurrency: 3
      shutdown-timeout: 30s
      observation-enabled: true

    template:
      observation-enabled: true


server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.web: INFO
  structured:
    format:
      console: logstash

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: 1800000
      issuer: case-management-api

  rate-limit:
    user-requests-per-minute: 60
    login-requests-per-minute: 10

  kafka:
    outbox:
      poll-interval-ms: 60000
    consumer:
      retry:
        max-attempts: 4
        initial-interval-ms: 1000
        multiplier: 2.0
        max-interval-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

  tracing:
    sampling:
      probability: 0.1
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
